          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct));
      })
      .then(function (buf) {
        var html = new TextDecoder().decode(buf);
        try {
          sessionStorage.setItem(KEY, code);
          if ((manual || demo) && false) sessionStorage.setItem('tsiIntroPending', '1');
        } catch (e) {}
        html = html.replace('<html', '<html data-tsi-gated' + (demo && false ? ' data-tsi-demo' : ''));
        document.open(); document.write(html); document.close();
      });
  }
  var stored = null;
  var demo = false;
  try {
    stored = sessionStorage.getItem(KEY);
    demo = sessionStorage.getItem('tsiDemoMotion') === '1';
    if (demo) sessionStorage.removeItem('tsiDemoMotion');
  } catch (e) {}
  if (stored) { unlock(stored, false, demo).catch(function () {}); }
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('c').value.trim();
    document.getElementById('e').textContent = '';
    unlock(v, true, false).catch(function () {
      document.getElementById('e').textContent = 'That code did not work. Try again.';
      document.getElementById('c').value = '';
      document.getElementById('c').focus();
    });
  });
})();
</script>
