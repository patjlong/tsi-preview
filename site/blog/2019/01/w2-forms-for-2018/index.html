*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;background:#0B161B;color:#F4F6F3;

.err{min-height:1.4rem;margin-block-start:1rem;font-size:.85rem;color:#E8A0A0}
.foot{margin-block-start:2.4rem;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#5C7C88}
</style>
