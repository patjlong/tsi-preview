<title>Online Application Form</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;background:#0B161B;color:#F4F6F3;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:1.5rem}
.card{inline-size:min(100%,26rem);text-align:center}
.mark{inline-size:clamp(120px,26vw,190px);margin:0 auto 1.6rem;display:block}
h1{font-size:1.05rem;font-weight:600;letter-spacing:.01em;margin-block-end:.4rem}
p{font-size:.9rem;color:#9BC2CF;margin-block-end:1.6rem;line-height:1.5}
form{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
input{inline-size:9rem;font:inherit;font-size:1.5rem;letter-spacing:.5em;text-align:center;
  padding:.7rem .5rem .7rem .9rem;border:1px solid #2E5C6B;border-radius:3px;background:#08202A;color:#F4F6F3}
input:focus{outline:2px solid #7EC6DB;outline-offset:2px}
button{font:inherit;font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:.75rem 1.4rem;border:0;border-radius:3px;background:#7EC6DB;color:#061A22;cursor:pointer}
.err{min-height:1.4rem;margin-block-start:1rem;font-size:.85rem;color:#E8A0A0}
.foot{margin-block-start:2.4rem;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#5C7C88}
</style>
